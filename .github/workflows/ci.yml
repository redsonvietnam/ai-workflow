name: CI Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          # No npm dependencies in this project

      - name: Run verification suite
        run: |
          node wf/test-t134.mjs
          node wf/test-plan.mjs
          node wf/test-path-negative.mjs
          node wf/test-f3-state-validation.mjs
          node wf/test-payload-log.mjs
          node wf/pipeline.mjs verifychain

      - name: Verify chain seal
        run: |
          node wf/pipeline.mjs seal

  # Windows-specific tests (junctions, case-insensitivity)
  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Run Windows verification
        run: |
          node wf/test-t134.mjs
          node wf/test-plan.mjs
          node wf/test-path-negative.mjs
          node wf/test-f3-state-validation.mjs
          node wf/test-payload-log.mjs
          node wf/pipeline.mjs verifychain
          node wf/pipeline.mjs seal